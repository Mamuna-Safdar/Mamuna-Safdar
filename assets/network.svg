<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-label="Cute little spiders, some wearing bows, crawl through a network (query, retrieve, verify, answer); a bigger spider with a bow peeks out of its nest and hides again.">
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#8B949E;font-size:12px;letter-spacing:.06em}
.n{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.2);opacity:1}}
.lg{transform-box:fill-box;animation:wig .32s ease-in-out infinite alternate}
.lg.l{transform-origin:100% 50%}.lg.r{transform-origin:0% 50%}
@keyframes wig{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.big{animation:peek 9s ease-in-out infinite}
@keyframes peek{0%,8%{transform:translateY(-95px)}22%{transform:translateY(0)}30%{transform:translateY(-6px)}38%{transform:translateY(0)}46%{transform:translateY(-4px)}56%,64%{transform:translateY(0)}70%,100%{transform:translateY(-95px)}}
.look{transform-box:fill-box;transform-origin:50% 0;animation:look 9s ease-in-out infinite}
@keyframes look{0%,24%{transform:rotate(0)}32%{transform:rotate(12deg)}42%{transform:rotate(-12deg)}52%,100%{transform:rotate(0)}}
.nest{transform-box:fill-box;transform-origin:50% 0;animation:shake 9s ease-in-out infinite}
@keyframes shake{0%,69%{transform:rotate(0)}72%{transform:rotate(5deg)}75%{transform:rotate(-4deg)}78%{transform:rotate(2deg)}81%,100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.n,.lg,.blink,.big,.look,.nest{animation:none}.crawler{display:none}}
</style>
