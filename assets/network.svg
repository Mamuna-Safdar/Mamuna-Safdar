 d="M8.5,-5 Q15.5,-12 19.5,-2" fill="none" stroke="#8E97A8" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.00s"/><path class="lg l" d="M-8.5,-1 Q-15.5,-8 -19.5,2" fill="none" stroke="#8E97A8" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.08s"/><path class="lg r" d="M8.5,-1 Q15.5,-8 19.5,2" fill="none" stroke="#8E97A8" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.08s"/><path class="lg l" d="M-8.5,3 Q-15.5,-4 -19.5,6" fill="none" stroke="#8E97A8" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.16s"/><path class="lg r" d="M8.5,3 Q15.5,-4 19.5,6" fill="none" stroke="#8E97A8" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.16s"/><path class="lg l" d="M-8.5,7 Q-15.5,0 -19.5,10" fill="none" stroke="#8E97A8" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.24s"/><path class="lg r" d="M8.5,7 Q15.5,0 19.5,10" fill="none" stroke="#8E97A8" stroke-width="2.2" stroke-linecap="round" style="animation-delay:0.24s"/><circle r="10" fill="#8E97A8"/><g class="blink"><circle cx="-4" cy="-2" r="3.6" fill="#fff"/><circle cx="4" cy="-2" r="3.6" fill="#fff"/><circle cx="-3.6" cy="-1.4" r="1.9" fill="#1F2328"/><circle cx="4.4" cy="-1.4" r="1.9" fill="#1F2328"/><circle cx="-3" cy="-2.2" r=".7" fill="#fff"/><circle cx="5" cy="-2.2" r=".7" fill="#fff"/></g><ellipse cx="-6.8" cy="3.2" rx="1.9" ry="1.2" fill="#F4A6B8" opacity=".9"/><ellipse cx="6.8" cy="3.2" rx="1.9" ry="1.2" fill="#F4A6B8" opacity=".9"/><path d="M-2,4.2 Q0,6.4 2,4.2" fill="none" stroke="#1F2328" stroke-width="1" stroke-linecap="round"/><g transform="translate(-5.5,-9.5) rotate(-18)"><path d="M0,0 L-5,-3.2 L-5,3.2 Z" fill="#FF6FA3"/><path d="M0,0 L5,-3.2 L5,3.2 Z" fill="#FF6FA3"/><circle r="1.6" fill="#E04D86"/></g></g>
