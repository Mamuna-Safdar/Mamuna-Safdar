<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="Animated network: query, retrieve, verify, answer, with a small spider hanging on a thread">
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#8B949E;font-size:12px;letter-spacing:.06em}
.n{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.25);opacity:1}}
.sp{animation:bob 3.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(46px)}}
.leg{transform-box:fill-box;animation:wig .6s ease-in-out infinite alternate}
.leg.l{transform-origin:right center}.leg.r{transform-origin:left center}
@keyframes wig{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@media (prefers-reduced-motion:reduce){.n,.sp,.leg{animation:none}.pulse{display:none}}
</style>
