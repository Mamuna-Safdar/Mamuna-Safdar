<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="Mamuna Safdar. MS Computer Science, FAST-NUCES. Hallucination mitigation in RAG, LLM evaluation, Urdu NLP. A cute spider with a bow climbs out of a transformer block and says: checking sources, grounded, or I don't know.">
<style>
