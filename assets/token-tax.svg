<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Urdu token tax by tokenizer">
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#8B949E}
.t{font-size:18px;font-weight:600}.s{font-size:12px}.l{font-size:13px;font-weight:600}.v{font-size:12px;font-weight:600;opacity:0;animation:fade .5s ease forwards}
.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards}
.ref{stroke-dasharray:6 5;animation:dash 1.2s linear forwards;stroke-dashoffset:700}
@keyframes grow{to{transform:scaleY(1)}}@keyframes fade{to{opacity:1}}@keyframes dash{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.bar{animation:none;transform:none}.v{animation:none;opacity:1}}
</style>
<text class="t" x="40" y="32">Urdu token tax: tokens needed compared with English</text>
<text class="s" x="40" y="52">Same 20 sentences, 4 tokenizers. 1.0× = same cost as English.</text>
<line x1="70" x2="690" y1="290.0" y2="290.0" stroke="#8B949E" stroke-opacity="0.35"/>
<text class="s" x="60" y="294.0" text-anchor="end">0×</text>
<line x1="70" x2="690" y1="216.7" y2="216.7" stroke="#8B949E" stroke-opacity="0.12"/>
<text class="s" x="60" y="220.7" text-anchor="end">1×</text>
<line x1="70" x2="690" y1="143.3" y2="143.3" stroke="#8B949E" stroke-opacity="0.12"/>
<text class="s" x="60" y="147.3" text-anchor="end">2×</text>
<line x1="70" x2="690" y1="70.0" y2="70.0" stroke="#8B949E" stroke-opacity="0.12"/>
<text class="s" x="60" y="74.0" text-anchor="end">3×</text>
<rect class="bar" x="110" y="185.1" width="44" height="104.9" rx="3" fill="#14A38E" style="animation-delay:0.25s"/>
<text class="v" x="132.0" y="179.1" text-anchor="middle" style="animation-delay:1.05s">1.43</text>
<rect class="bar" x="162" y="171.9" width="44" height="118.1" rx="3" fill="#E8833A" style="animation-delay:0.37s"/>
<text class="v" x="184.0" y="165.9" text-anchor="middle" style="animation-delay:1.17s">1.61</text>
<text class="l" x="158.0" y="312" text-anchor="middle">GPT-4o</text>
<rect class="bar" x="260" y="78.1" width="44" height="211.9" rx="3" fill="#14A38E" style="animation-delay:0.50s"/>
<text class="v" x="282.0" y="72.1" text-anchor="middle" style="animation-delay:1.30s">2.89</text>
<rect class="bar" x="312" y="157.3" width="44" height="132.7" rx="3" fill="#E8833A" style="animation-delay:0.62s"/>
<text class="v" x="334.0" y="151.3" text-anchor="middle" style="animation-delay:1.42s">1.81</text>
<text class="l" x="308.0" y="312" text-anchor="middle">Qwen2.5</text>
<rect class="bar" x="410" y="217.4" width="44" height="72.6" rx="3" fill="#14A38E" style="animation-delay:0.75s"/>
<text class="v" x="432.0" y="211.4" text-anchor="middle" style="animation-delay:1.55s">0.99</text>
<rect class="bar" x="462" y="186.6" width="44" height="103.4" rx="3" fill="#E8833A" style="animation-delay:0.87s"/>
<text class="v" x="484.0" y="180.6" text-anchor="middle" style="animation-delay:1.67s">1.41</text>
<text class="l" x="458.0" y="312" text-anchor="middle">XLM-R</text>
<rect class="bar" x="560" y="173.4" width="44" height="116.6" rx="3" fill="#14A38E" style="animation-delay:1.00s"/>
<text class="v" x="582.0" y="167.4" text-anchor="middle" style="animation-delay:1.80s">1.59</text>
<rect class="bar" x="612" y="169.7" width="44" height="120.3" rx="3" fill="#E8833A" style="animation-delay:1.12s"/>
<text class="v" x="634.0" y="163.7" text-anchor="middle" style="animation-delay:1.92s">1.64</text>
<text class="l" x="608.0" y="312" text-anchor="middle">mBERT</text>
<line class="ref" x1="70" x2="690" y1="216.7" y2="216.7" stroke="#8B949E" stroke-width="1.5"/>
<rect x="440" y="72" width="12" height="12" rx="2" fill="#14A38E"/><text class="s" x="458" y="82">Urdu script</text>
<rect x="550" y="72" width="12" height="12" rx="2" fill="#E8833A"/><text class="s" x="568" y="82">Roman Urdu</text>
<line x1="440" x2="458" y1="100" y2="100" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="4 3"/><text class="s" x="464" y="104">same as English (1×)</text>
</svg>